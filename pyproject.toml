[project]
name = "pexpect"
dynamic = ["version"]
readme = "README.rst"
requires-python = ">=3.10"
dependencies = [
    # ptyprocess imports termios while being imported, so the marker is not
    # an optimisation -- an unmarked install would fail on Windows.
    "ptyprocess>=0.7.0; sys_platform != 'win32'",
    # ConPTY, plus the OpenConsole.exe and conpty.dll it bundles, which is why
    # Windows 10 and 11 are both covered rather than only builds new enough to
    # ship a system ConPTY. Wheels are published for cp310 through cp314, the
    # whole of .python-versions.
    "pywinpty>=3.0.5; sys_platform == 'win32'",
]
authors = [
  {name = "Noah Spurrier", email="noah@noah.org"},
  {name = "Thomas Kluyver", email="thomas@kluyver.me.uk"},
  {name = "Jeff Quast", email="contact@jeffquast.com"},
]
maintainers = []
license-files = ["LICENSE"]
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Environment :: Console',
    'Intended Audience :: Developers',
    'Intended Audience :: System Administrators',
    'Operating System :: POSIX',
    'Operating System :: MacOS :: MacOS X',
    'Operating System :: Microsoft :: Windows',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Topic :: Software Development',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Software Development :: Quality Assurance',
    'Topic :: Software Development :: Testing',
    'Topic :: System',
    'Topic :: System :: Archiving :: Packaging',
    'Topic :: System :: Installation/Setup',
    'Topic :: System :: Shells',
    'Topic :: System :: Software Distribution',
    'Topic :: Terminals',
]

[project.urls]
    Homepage='https://pexpect.readthedocs.io/'
    Documentation= "https://pexpect.readthedocs.io/"
    Issues = "https://github.com/pexpect/pexpect/issues"
    Repository =  "https://github.com/pexpect/pexpect"
    Changelog =  "https://pexpect.readthedocs.io/en/stable/history.html"




[dependency-groups]
dev = [
    "covdefaults>=2.3.0",
    "coverage>=7.16.0",
    "mypy>=2.3.1",
    "nox>=2026.8.17",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-html>=4.2.0",
    "pytest-randomly>=5.0.0",
    "pytest-time>=0.5.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.6",
]


[build-system]
requires = ["setuptools >= 77.0.3", "setuptools_scm"]
build-backend = "setuptools.build_meta"


[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.uv]
# python-preference = "only-system"

# Ensure that we use the public Python Package Index.
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true


[tool.coverage]
run.omit = [  "noxfile.py" ]
run.parallel = true
run.plugins = [ "covdefaults" ]
# source_pkgs, not source: a bare "pexpect" in `source` is taken as a directory
# whenever one of that name exists next to the config, and only as a package
# when it does not. Under the src layout the package is src/pexpect, so a stray
# ./pexpect/ would silently measure nothing while every child process -- which
# runs from tests/, where the directory is not visible -- measured the real
# thing. source_pkgs always means "import it and measure where it landed".
run.source_pkgs = ["pexpect"]
# Empty, but present: covdefaults substitutes source = ["."] when `source` is
# unset, which would measure tests/ and noxfile.py alongside the library and
# make report.fail_under a statement about the suite instead of about pexpect.
run.source = []
# ref: https://coverage.readthedocs.io/en/latest/excluding.html
report.exclude_also = [
    "@(abc\\.)?abstractmethod",
    "class .*\\bProtocol\\):",
    "def __repr__",
    "if __name__ == .__main__.:",
    "if 0:",
    "if self.debug:",
    "if settings.DEBUG",
    # One of the two is dead on any given run, and neither can be executed on
    # the other platform, so a covered platform branch is not a thing either
    # floor can ask for. What holds them honest instead is that every branch
    # guarded this way has a test in tests/test_unsupported.py asserting the
    # behaviour on the platform that reaches it.
    "if sys\\.platform == .win32.:",
    "if sys\\.platform != .win32.:",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
]
report.fail_under = 100
xml.output = "coverage-reports/coverage-report.xml"




[tool.ruff]
target-version = "py310"  # as per README
line-length = 99
format.docstring-code-format = true
lint.select = [ "ALL" ]
lint.ignore = [
    "COM812", # conflict with autoformatter
    "D203",   # conflict with autoformatter,
    "D213",   # conflict with autoformatter
    # ignore for now
    "FIX001", # used as a placeholder for further work
    "FIX002", # TODOs are not blockers
    "ISC001", # conflict with autoformatter
    "SLF001", # accessing protected members
    "T201",   # allow usage of print
    "TD",     # one-man shop here
    # LICENSE at the repo root covers distribution; per-file headers add drift
    # without legal upside.
    "CPY001",
]
lint.fixable = [ "ALL" ]
lint.unfixable = [
    "F401", # we must know why we are not using the imported module
]
lint.per-file-ignores."tests/*" = [
    "S101",   # pytest works with assert
]

# Annotations are maintained for the shipped library and its test suite only.
lint.per-file-ignores."examples/*" = [ "ANN" ]
lint.per-file-ignores."tools/*" = [ "ANN" ]
lint.per-file-ignores."doc/*" = [ "ANN" ]

# The names, arities and boolean flags below are pexpect's documented public
# interface. Renaming a class or module, splitting a signature or making a flag
# keyword-only would break every downstream caller, so these rules are silenced
# per file rather than obeyed. New modules are still checked.
lint.per-file-ignores."src/pexpect/ANSI.py" = [
    "N801",   # `term` is public API
    "N802",   # `DoEmit` and friends are public FSM action callbacks
    "N999",   # imported as `pexpect.ANSI`
]
lint.per-file-ignores."src/pexpect/FSM.py" = [
    "N802",   # `BeginBuildNumber` and friends are public FSM action callbacks
    "N818",   # `ExceptionFSM` is public API
    "N999",   # imported as `pexpect.FSM`
]
# The backend mirrors ptyprocess.PtyProcess, which pty_spawn calls positionally
# -- close(force), setecho(state), terminate(force), spawn(..., echo=...).
# Making those keyword-only here would break the call sites that already exist.
lint.per-file-ignores."src/pexpect/_winpty.py" = [
    "FBT001", "FBT002",  # boolean flags, positional because ptyprocess's are
    "PLR0913", "PLR0917",  # spawn() takes ptyprocess's argument list
]
lint.per-file-ignores."src/pexpect/exceptions.py" = [
    "N818",   # `ExceptionPexpect` is public API
]
lint.per-file-ignores."src/pexpect/expect.py" = [
    "N801",   # `searcher_string` and `searcher_re` are public API
]
lint.per-file-ignores."src/pexpect/fdpexpect.py" = [
    "FBT001", "FBT002",  # public positional/keyword bool flags
    "N801",   # `fdspawn` is public API
    "PLR0913", "PLR0917",  # `fdspawn.__init__` signature is public API
]
lint.per-file-ignores."src/pexpect/popen_spawn.py" = [
    "PLR0913", "PLR0917",  # `PopenSpawn.__init__` signature is public API
]
lint.per-file-ignores."src/pexpect/pty_spawn.py" = [
    "FBT001", "FBT002",  # public positional/keyword bool flags, e.g. `close(force=True)`
    "N801",   # `spawn` is public API
    "PLR0913", "PLR0917",  # `spawn.__init__` signature is public API
]
lint.per-file-ignores."src/pexpect/pxssh.py" = [
    "FBT001", "FBT002",  # public positional/keyword bool flags
    "N801",   # `pxssh` is public API
    "PLR0913", "PLR0917",  # `pxssh.login` signature is public API
]
lint.per-file-ignores."src/pexpect/replwrap.py" = [
    "FBT001", "FBT002", "FBT003",  # public bool flags
    "PLR0913", "PLR0917",  # `REPLWrapper.__init__` signature is public API
]
lint.per-file-ignores."src/pexpect/run.py" = [
    "FBT001", "FBT002",  # public positional/keyword bool flags
    "PLR0913", "PLR0917",  # `run` and `runu` signatures are public API
]
lint.per-file-ignores."src/pexpect/screen.py" = [
    "N801",   # `screen` is public API
]
lint.per-file-ignores."src/pexpect/socket_pexpect.py" = [
    "FBT001", "FBT002",  # public positional/keyword bool flags
    "PLR0913", "PLR0917",  # `SocketSpawn.__init__` signature is public API
]
lint.per-file-ignores."src/pexpect/spawnbase.py" = [
    "FBT001", "FBT002",  # public positional/keyword bool flags
    "PLR0913", "PLR0917",  # `SpawnBase.__init__` signature is public API
]

[tool.pytest]
# No --timeout here on purpose. The per-test budget is a number of child
# processes rather than a number of seconds, because starting one is what a test
# outside tests/integration mostly costs and how long that takes is a property
# of the machine: on the hardware the suite was written on it is about 50 ms and
# the slowest test 80 ms, while on an aarch64 SBC the same child costs 290 ms
# and the same test 1.2 s. A fixed 150 ms means "no test may hang" on the first
# machine and "no test may run at all" on the second.
#
# So tests/conftest.py measures one child at collection time and marks each test
# with the budget that earns, never going below the 150 ms this suite was
# written to. tests/integration/conftest.py sets its own, generous budget.

# A warning is a defect, so it fails the run that produced it. No exemptions:
# the one warning this suite expects is pexpect.screen's own deprecation
# notice, which is asserted by a test of its own and let through at the two
# imports that raise it -- see tests/test_screen.py. Stated here rather than as
# `-W error` in addopts because a filter given on the command line outranks
# every filter given in a config file, including the per-test ones a
# `filterwarnings` mark installs.
filterwarnings = [
    "error",
]

[tool.mypy]
check_untyped_defs = true
# pexpect is a POSIX library: `pty`, `termios`, `tty` and `fcntl` exist nowhere
# else, and neither do `pexpect.spawn` and `pexpect.run`, which `__init__`
# exports behind a `sys.platform` check. mypy analyses for the platform it is
# running on, so on a Windows checkout all of that drops out of the stubs and
# the run ends in several hundred attr-defined errors about code that never
# executes there. Pinning the platform makes every machine reach the same
# verdict, and the verdict worth reaching is the POSIX one.
# ref: https://mypy.readthedocs.io/en/stable/command_line.html#cmdoption-mypy-platform
platform = "linux"


# ptyprocess ships no py.typed marker. Following its untyped source keeps
# `PtyProcess` members resolvable (spawn.ptyproc is used throughout pty_spawn)
# without silencing the import error, which would make the whole module Any.
[[tool.mypy.overrides]]
module = [ "ptyprocess", "ptyprocess.*" ]
follow_untyped_imports = true

# pywinpty ships _winpty.pyi but no py.typed marker. follow_untyped_imports
# resolves its members where the package is installed -- the Windows runners --
# and ignore_missing_imports keeps a Linux checkout, where it is not installed
# and cannot be, from failing the --platform win32 pass with import-not-found.
[[tool.mypy.overrides]]
module = [ "winpty", "winpty.*" ]
follow_untyped_imports = true
ignore_missing_imports = true
