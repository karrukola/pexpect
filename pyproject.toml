[project]
name = "pexpect"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "ptyprocess>=0.7.0",
]
authors = [
  {name = "Noah Spurrier", email="noah@noah.org"},
  {name = "Thomas Kluyver", email="thomas@kluyver.me.uk"},
  {name = "Jeff Quast", email="contact@jeffquast.com"},
]
maintainers = []
license-files = ["LICENSE"]
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Environment :: Console',
    'Intended Audience :: Developers',
    'Intended Audience :: System Administrators',
    'Operating System :: POSIX',
    'Operating System :: MacOS :: MacOS X',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Topic :: Software Development',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Software Development :: Quality Assurance',
    'Topic :: Software Development :: Testing',
    'Topic :: System',
    'Topic :: System :: Archiving :: Packaging',
    'Topic :: System :: Installation/Setup',
    'Topic :: System :: Shells',
    'Topic :: System :: Software Distribution',
    'Topic :: Terminals',
]

[project.urls]
    Homepage='https://pexpect.readthedocs.io/'
    Documentation= "https://pexpect.readthedocs.io/"
    Issues = "https://github.com/pexpect/pexpect/issues"
    Repository =  "https://github.com/pexpect/pexpect"
    Changelog =  "https://pexpect.readthedocs.io/en/stable/history.html"




[dependency-groups]
dev = [
    "covdefaults>=2.3.0",
    "coverage>=7.16.0",
    "coveralls>=4.1.0",
    "nox>=2026.8.17",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-html>=4.2.0",
    "ruff>=0.16.6",
]


[build-system]
requires = ["setuptools >= 77.0.3", "setuptools_scm"]
build-backend = "setuptools.build_meta"


[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.uv]
python-preference = "only-system"

# Ensure that we use the public Python Package Index.
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true


[tool.coverage]
run.omit = [  "noxfile.py" ]
run.parallel = true
run.plugins = [ "covdefaults" ]
run.source = ["pexpect"]
# ref: https://coverage.readthedocs.io/en/latest/excluding.html
report.exclude_also = [
    "@(abc\\.)?abstractmethod",
    "class .*\\bProtocol\\):",
    "def __repr__",
    "if __name__ == .__main__.:",
    "if 0:",
    "if self.debug:",
    "if settings.DEBUG",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
]
report.fail_under = 100
xml.output = "coverage-reports/coverage-report.xml"




[tool.ruff]
target-version = "py310"  # as per README
line-length = 99
format.docstring-code-format = true
lint.select = [ "ALL" ]
lint.ignore = [
    "COM812", # conflict with autoformatter
    "D203",   # conflict with autoformatter,
    "D213",   # conflict with autoformatter
    # ignore for now
    "FIX001", # used as a placeholder for further work
    "FIX002", # TODOs are not blockers
    "ISC001", # conflict with autoformatter
    "SLF001", # accessing protected members
    "T201",   # allow usage of print
    "TD",     # one-man shop here
    # LICENSE at the repo root covers distribution; per-file headers add drift
    # without legal upside.
    "CPY001",
]
lint.fixable = [ "ALL" ]
lint.unfixable = [
    "F401", # we must know why we are not using the imported module
]
lint.per-file-ignores."tests/*" = [
    "S101",   # pytest works with assert
]

# Annotations are maintained for the shipped library and its test suite only.
lint.per-file-ignores."examples/*" = [ "ANN" ]
lint.per-file-ignores."tools/*" = [ "ANN" ]
lint.per-file-ignores."doc/*" = [ "ANN" ]

# The names, arities and boolean flags below are pexpect's documented public
# interface. Renaming a class or module, splitting a signature or making a flag
# keyword-only would break every downstream caller, so these rules are silenced
# per file rather than obeyed. New modules are still checked.
lint.per-file-ignores."src/pexpect/ANSI.py" = [
    "N801",   # `term` is public API
    "N802",   # `DoEmit` and friends are public FSM action callbacks
    "N999",   # imported as `pexpect.ANSI`
]
lint.per-file-ignores."src/pexpect/FSM.py" = [
    "N802",   # `BeginBuildNumber` and friends are public FSM action callbacks
    "N818",   # `ExceptionFSM` is public API
    "N999",   # imported as `pexpect.FSM`
]
lint.per-file-ignores."src/pexpect/exceptions.py" = [
    "N818",   # `ExceptionPexpect` is public API
]
lint.per-file-ignores."src/pexpect/expect.py" = [
    "N801",   # `searcher_string` and `searcher_re` are public API
]
lint.per-file-ignores."src/pexpect/fdpexpect.py" = [
    "FBT001", "FBT002",  # public positional/keyword bool flags
    "N801",   # `fdspawn` is public API
    "PLR0913", "PLR0917",  # `fdspawn.__init__` signature is public API
]
lint.per-file-ignores."src/pexpect/popen_spawn.py" = [
    "PLR0913", "PLR0917",  # `PopenSpawn.__init__` signature is public API
]
lint.per-file-ignores."src/pexpect/pty_spawn.py" = [
    "FBT001", "FBT002",  # public positional/keyword bool flags, e.g. `close(force=True)`
    "N801",   # `spawn` is public API
    "PLR0913", "PLR0917",  # `spawn.__init__` signature is public API
]
lint.per-file-ignores."src/pexpect/pxssh.py" = [
    "FBT001", "FBT002",  # public positional/keyword bool flags
    "N801",   # `pxssh` is public API
    "PLR0913", "PLR0917",  # `pxssh.login` signature is public API
]
lint.per-file-ignores."src/pexpect/replwrap.py" = [
    "FBT001", "FBT002", "FBT003",  # public bool flags
    "PLR0913", "PLR0917",  # `REPLWrapper.__init__` signature is public API
]
lint.per-file-ignores."src/pexpect/run.py" = [
    "FBT001", "FBT002",  # public positional/keyword bool flags
    "PLR0913", "PLR0917",  # `run` and `runu` signatures are public API
]
lint.per-file-ignores."src/pexpect/screen.py" = [
    "N801",   # `screen` is public API
]
lint.per-file-ignores."src/pexpect/socket_pexpect.py" = [
    "FBT001", "FBT002",  # public positional/keyword bool flags
    "PLR0913", "PLR0917",  # `SocketSpawn.__init__` signature is public API
]
lint.per-file-ignores."src/pexpect/spawnbase.py" = [
    "FBT001", "FBT002",  # public positional/keyword bool flags
    "PLR0913", "PLR0917",  # `SpawnBase.__init__` signature is public API
]
